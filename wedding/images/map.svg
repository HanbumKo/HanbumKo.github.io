<svg viewBox="0 0 320 248" xmlns="http://www.w3.org/2000/svg" width="100%" style="display:block;font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif">

  <!-- Background -->
  <rect width="320" height="248" fill="#ede9f5"/>

  <!-- ══ ROADS ══ -->
  <!-- Top horizontal road -->
  <rect x="0" y="0" width="320" height="13" fill="#f8f7fb"/>
  <!-- Bottom horizontal road (subway) -->
  <rect x="0" y="196" width="320" height="13" fill="#f8f7fb"/>
  <!-- 테헤란로 (left vertical) -->
  <rect x="79" y="0" width="13" height="248" fill="#f8f7fb"/>
  <!-- 봉은사로 (right vertical) -->
  <rect x="240" y="0" width="13" height="248" fill="#f8f7fb"/>
  <!-- Middle horizontal road (inner) -->
  <rect x="92" y="88" width="148" height="9" fill="#f8f7fb"/>
  <!-- Small gap between 파르나스 and 무역센터 -->
  <rect x="92" y="146" width="64" height="5" fill="#f8f7fb"/>

  <!-- ══ OUTSIDE LEFT: 글라스 타워 ══ -->
  <rect x="3" y="108" width="74" height="76" rx="3" fill="#d0cce2" opacity="0.6"/>
  <text x="40" y="149" font-size="8" fill="#6a6482" text-anchor="middle">글라스 타워</text>

  <!-- Top-left block (강남 방면) -->
  <rect x="3" y="13" width="74" height="73" rx="3" fill="#ccc8de" opacity="0.4"/>

  <!-- ══ OUTSIDE RIGHT: 봉은사 ══ -->
  <rect x="255" y="13" width="63" height="72" rx="3" fill="#d0cce2" opacity="0.6"/>
  <text x="286" y="53" font-size="8.5" fill="#6a6482" text-anchor="middle">봉은사</text>

  <!-- ══ UPPER ROW BUILDINGS ══ -->

  <!-- 현대백화점 -->
  <rect x="92" y="13" width="62" height="73" rx="3" fill="#ccc8de"/>
  <text x="123" y="53" font-size="8.5" fill="#2e2a3c" text-anchor="middle">현대백화점</text>

  <!-- SONO FELICE (main venue) -->
  <rect x="156" y="13" width="54" height="73" rx="3" fill="#2e2a3c"/>
  <text x="183" y="38" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">SONO</text>
  <text x="183" y="50" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">FELICE</text>
  <text x="183" y="62" font-size="5.5" fill="#b0aac6" text-anchor="middle" letter-spacing="1">CONVENTION</text>
  <!-- Venue pin -->
  <circle cx="183" cy="10" r="5" fill="#8a86a8"/>
  <polygon points="183,6 186,14 183,12 180,14" fill="#8a86a8"/>

  <!-- 공항타워 / 오크우드 등 소형 빌딩 그룹 -->
  <rect x="212" y="13" width="14" height="73" rx="2" fill="#c8c4d8"/>
  <rect x="228" y="13" width="10" height="73" rx="2" fill="#c4c0d4"/>
  <text x="219" y="45" font-size="5.5" fill="#6a6482" text-anchor="middle" writing-mode="vertical-rl">공항타워</text>
  <text x="233" y="43" font-size="5.5" fill="#6a6482" text-anchor="middle" writing-mode="vertical-rl">오크우드</text>

  <!-- ══ LOWER SECTION BUILDINGS ══ -->

  <!-- 그랜드 인터컨티넨탈 -->
  <rect x="92" y="99" width="62" height="44" rx="3" fill="#ccc8de"/>
  <text x="123" y="117" font-size="7" fill="#2e2a3c" text-anchor="middle">그랜드</text>
  <text x="123" y="128" font-size="7" fill="#2e2a3c" text-anchor="middle">인터컨티넨탈</text>

  <!-- 파르나스타워 -->
  <rect x="92" y="153" width="62" height="40" rx="3" fill="#ccc8de"/>
  <text x="123" y="176" font-size="7" fill="#2e2a3c" text-anchor="middle">파르나스타워</text>

  <!-- 무역센터 (아래 중앙) -->
  <rect x="92" y="153" width="62" height="40" rx="3" fill="#ccc8de"/>
  <!-- (파르나스와 위치 공유, 아래로 조정) -->

  <!-- COEX (대형) -->
  <rect x="156" y="99" width="82" height="94" rx="3" fill="#c4c0d8"/>
  <text x="197" y="152" font-size="12" fill="#2e2a3c" text-anchor="middle" font-weight="bold">COEX</text>

  <!-- 무역센터 실제 위치: 파르나스 아래가 아닌 COEX 왼쪽 아래 -->
  <!-- 이미 파르나스가 있어서 무역센터는 별도 표기 없이 COEX 하단 레이블로 -->

  <!-- ══ SUBWAY STATIONS ══ -->
  <!-- 2호선 삼성역 5번 출구 -->
  <circle cx="85" cy="202" r="8" fill="#ffffff" stroke="#2e2a3c" stroke-width="1.5"/>
  <text x="85" y="206" font-size="7.5" fill="#2e2a3c" text-anchor="middle" font-weight="bold">5</text>
  <text x="85" y="219" font-size="6" fill="#2e2a3c" text-anchor="middle">2호선</text>
  <text x="85" y="228" font-size="6" fill="#2e2a3c" text-anchor="middle">삼성역</text>

  <!-- 9호선 봉은사역 7번 출구 -->
  <circle cx="246" cy="202" r="8" fill="#ffffff" stroke="#2e2a3c" stroke-width="1.5"/>
  <text x="246" y="206" font-size="7.5" fill="#2e2a3c" text-anchor="middle" font-weight="bold">7</text>
  <text x="246" y="219" font-size="6" fill="#2e2a3c" text-anchor="middle">9호선</text>
  <text x="246" y="228" font-size="6" fill="#2e2a3c" text-anchor="middle">봉은사역</text>

  <!-- 현대자동차 글로벌 비즈니스센터 (지하철 아래) -->
  <rect x="114" y="211" width="102" height="26" rx="3" fill="#c8c4d8" opacity="0.6"/>
  <text x="165" y="225" font-size="6" fill="#6a6482" text-anchor="middle">현대자동차 글로벌 비즈니스센터</text>

  <!-- ══ ROAD LABELS ══ -->
  <text transform="translate(85,148) rotate(-90)" font-size="8" fill="#9890aa" text-anchor="middle" letter-spacing="2">테헤란로</text>
  <text transform="translate(246,148) rotate(90)" font-size="8" fill="#9890aa" text-anchor="middle" letter-spacing="2">봉은사로</text>

  <!-- ══ DIRECTION HINTS ══ -->
  <text x="40" y="10" font-size="5.5" fill="#b0aac6" text-anchor="middle">↑ 강남·삼성 방면</text>
  <text x="85" y="244" font-size="5.5" fill="#b0aac6" text-anchor="middle">↓ 종합운동장 방면</text>
  <text x="290" y="244" font-size="5.5" fill="#b0aac6" text-anchor="middle">영동대교 방면 →</text>

</svg>
